[package]
name = "juan-flasher"
version = "4.0.2"
description = "Professional AVR flashing and ISP utility"
authors = ["KennyNeutron"]
edition = "2021"

[lib]
name = "juan_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "1"
